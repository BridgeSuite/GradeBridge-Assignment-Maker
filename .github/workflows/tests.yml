# =====================================================
# The suite, run where the person who forgot cannot reach it
# =====================================================
# Until 2026-09-03 every check in this repository ran only when somebody typed
# `npm test`. There was no CI and no hook, so the privacy guards — no personal
# name, no absolute path, no image metadata, no tracked process record — were
# enforced by habit.
#
# WHAT THIS IS, AND WHAT IT IS NOT
#
#   This is the enforcement half. The `pre-push` hook in `.githooks/` is the
#   other half and it is NOT enforcement: it does not survive a clone, and
#   `git push --no-verify` skips it. This runs on the server, on every push and
#   every pull request, and cannot be skipped from a developer's machine.
#
#   **It catches a mistake AFTER the push, not before it.** By the time this job
#   turns red, the commit is on GitHub and, if the repository is public, it has
#   been fetchable by anyone and may already be indexed. For a name, a path or a
#   photograph's metadata that is not a near miss — publication has happened and
#   the fix is a history rewrite plus whatever disclosure that deserves.
#
#   So do not read a green tick as proof that nothing was ever published. Read
#   it as proof that nothing is published *now*. The control that actually
#   prevents disclosure is upstream of both: not writing the name, the path or
#   the process record into the repository in the first place.
#
# THIS FILE IS CANONICAL for both repositories (supplement 2, item C), and so is
# its FILENAME: `.github/workflows/tests.yml`, in both. It was `test.yml` here
# and `guards.yml` there, which is one job under two names in the first place a
# person looks — the same drift the reconciliation exists to stop.
#
# `tests` rather than `guards` because the job runs the whole suite plus `tsc`
# and the build, not only the disclosure guards, and somebody whose build broke
# would not think to look in a file called `guards`. The filename matches the
# `name:` below deliberately, so the tab in the Actions UI and the file on disk
# agree.
#
# Both repositories track `package-lock.json` and install with `npm ci`, with
# the npm cache keyed on it. Until 2026-09-24 this comment said the Student
# Submission copy differed from this one in exactly that step; it was this one
# that was wrong (see the install step below). Any difference between the two
# files is drift.
name: tests

on:
  push:
  pull_request:

# A second push to the same branch makes the first run's answer stale, and a
# stale green tick is worse than no tick.
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

# Read-only. This job inspects the tree; it has no business writing to it.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # The guards read `git ls-files`, which needs the working tree and
          # nothing else, so a shallow fetch is enough. They scan the tree as it
          # stands, never its history — history is a separate, authorised
          # question and not this job's business.
          fetch-depth: 1

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      # THE LOCKFILE IS TRACKED, and this installs exactly what it records.
      #
      # This step used to be `npm install`, with a comment saying `package.json`
      # pinned the versions that mattered and that this made the build
      # reproducible without a lockfile. CI run 22 (2026-09-24) disproved it:
      # `katex` is `^0.16.9`, this runner resolved 0.16.47 where the machine
      # that wrote the byte-for-byte goldens had 0.16.40, and the two HTML
      # documents that embed KaTeX differed. `jspdf` and `qrcode-generator` are
      # carets too, and they draw every PDF and every QR code this app emits.
      #
      # So a dependency update is now a deliberate act, a change to
      # `package-lock.json` that somebody made and CI saw. That is the cost,
      # and it is the intended one: the point of a byte-for-byte golden is that
      # a change in bytes means a change somebody made.
      # (WORKORDER_AM_GENERIC_ANSWER_PAGE_2026-09-24_SUPPLEMENT_1, item 2.)
      - run: npm ci

      # tsc, then the full suite: run-tests, templateTests, bundle-tests,
      # no-personal-names, no-process-records.
      #
      # The ENG17 checks inside templateTests read course material that lives
      # outside this repository and are absent here, so they report SKIP rather
      # than failing. That is deliberate — see tests/templateTests.mjs — and it
      # means a green run here does NOT cover them. They are covered locally,
      # where the files are.
      - run: npx tsc --noEmit
      - run: npm test
      - run: npm run build
